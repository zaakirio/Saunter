name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    # NOTE: `bun run build` runs Next.js env validation at module import, so every
    # server-side env var listed in src/env.ts must be supplied as a `--build-arg`
    # below AND declared as a matching `ARG`/`ENV` pair in the Dockerfile.
    # Currently only NEXT_PUBLIC_GMAPS_KEY is wired up; remaining vars must be
    # added when the corresponding GitHub secrets are configured (see Task 10).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_GMAPS_KEY=${{ secrets.NEXT_PUBLIC_GMAPS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/walkguide-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests
      - name: Update image tag
        working-directory: manifests/overlays/prod
        run: |
          curl -sLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          /tmp/kustomize edit set image walkguide=ghcr.io/${{ github.repository }}:${GITHUB_SHA::7}
      - name: Commit & push
        working-directory: manifests
        run: |
          git config user.email "ci@walkguide"
          git config user.name "CI"
          git add overlays/prod/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: bump walkguide image to ${GITHUB_SHA::7}"
          git push
