# This is a TEMPLATE. The engineer must run kubeseal with real values.
# Example for one secret:
#   echo -n 'mongodb+srv://...' | kubectl create secret generic walkguide-secrets \
#     --dry-run=client --from-file=MONGODB_URI=/dev/stdin -o yaml \
#     | kubeseal --format yaml --controller-namespace=kube-system > sealed-secret.yaml
#
# All required keys (must be combined into one SealedSecret named walkguide-secrets):
#   MONGODB_URI
#   BETTERAUTH_SECRET
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   GOOGLE_PLACES_KEY
#   GRAPHHOPPER_KEY
#   MAPBOX_KEY
#   DISCORD_WEBHOOK_URL  (optional)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: walkguide-secrets
spec:
  encryptedData:
    PLACEHOLDER: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: walkguide-secrets
    type: Opaque
