apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: walkguide
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [walkguide.example.com]
      secretName: walkguide-tls
  rules:
    - host: walkguide.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: walkguide
                port: { number: 80 }
